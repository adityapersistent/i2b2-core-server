name: CI Pipeline

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      database_image_branch:
        description: "Database Branch name to use for running tests"
        required: true
        default: "master"
        type: string

jobs:

  build:
    name: Build & Publish i2b2-core-server image
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HOST }}
          password: ${{ secrets.DOCKER_LOGIN_TOKEN }}

      - name: Determine tag
        id: vars
        run: |
          echo "core_tag=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "Using tag: $core_tag"

      - name: Build and Push image
        run: |
          # Fails the script immediately if a command exits with a non-zero status
          set -e 
          
          export CORE_SERVER_TAG="$core_tag"
          export docker_username=${{ secrets.DOCKER_HOST }}
          export docker_reponame=${{ secrets.DOCKER_REPO }}
          
          cd docker/
          bash create_docker_image.sh "$CORE_SERVER_TAG"

  test:   
    name: Run DB Tests
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    
    strategy:
      fail-fast: false # Prevents one failing DB test from cancelling the others
      matrix:
        db: [mssql, pg, oracle]

    steps:
      # Checkout the target test repository directly to save time writing clone scripts
      - name: Checkout Test Repository
        uses: actions/checkout@v4
        with:
          repository: i2b2/i2b2-docker
          path: i2b2-docker

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HOST }}
          password: ${{ secrets.DOCKER_LOGIN_TOKEN }}          
          
      - name: Run Test Cases
        run: |
          set -e
          cd i2b2-docker/${{ matrix.db }}

          export docker_username=${{ secrets.DOCKER_HOST }}
          export docker_reponame=${{ secrets.DOCKER_REPO }}

          # We can pull the ref_name dynamically or pass it from the build job outputs
          export core_tag=${{ github.ref_name }}
          echo "Running ${{ matrix.db }} test cases for tag: $core_tag"
          
          bash test_case.sh "$core_tag" ${{ inputs.database_image_branch }}

  
  deploy:
    name: Deploy i2b2 on AlmaLinux Enclave VM
    runs-on: [self-hosted, Linux, X64]
    if: github.ref == 'refs/heads/master'
    needs: build 
    environment: dev


    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: adityapersistent/i2b2-docker
          path: i2b2-docker


      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HOST }}
          password: ${{ secrets.DOCKER_LOGIN_TOKEN }}         

      - name: Deploy using Docker Compose
        working-directory: i2b2-docker/mssql
        shell: bash
        run: |
          # set -Eeuo pipefail

          docker compose stop
          # echo "core_tag=${{ github.ref_name }}" >> $GITHUB_ENV
          export core_tag=${{ github.ref_name }}

          echo $core_tag
          echo "hello"
          # Add your existing sed commands here
          safe_core_branch=$(echo "$core_tag" | tr '/' '-')
          echo "$safe_core_branch"
          # safe_data_branch=$(echo "$i2b2_data_branch" | tr '/' '-')


          export docker_username=${{ secrets.DOCKER_HOST }}
          export docker_reponame=${{ secrets.DOCKER_REPO }}

          # Build the image variables using the sanitized tags
          core_server_image="${docker_username}/${docker_reponame}:i2b2-core-server_${safe_core_branch}"
          # pgsql_image="${docker_username}/${docker_reponame}:i2b2-data-pgsql_${safe_data_branch}"

          #updating docker image tag
          # sed -i "s|i2b2/i2b2-webclient:\${I2B2_WEBCLIENT_TAG}|$docker_username/$docker_reponame:i2b2-webclient_latest|g" docker-compose.yml
          sed -i "s|i2b2/i2b2-core-server:\${I2B2_CORE_SERVER_TAG}|$core_server_image|g" docker-compose.yml
          # sed -i "s|i2b2/i2b2-data-pgsql:\${I2B2_DATA_PGSQL_TAG}|$pgsql_image|g" docker-compose.yml          

          docker compose up -d
          docker compose ps

